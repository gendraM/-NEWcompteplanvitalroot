name: Align-Life OBSERVE tests

on:
  push:
    branches:
      - Align-Life
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run OBSERVE tests
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: npx jest tests/myWayObserve.test.js tests/myWayObserve.p53.test.js --runInBand
