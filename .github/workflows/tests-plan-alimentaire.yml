name: Tests plan alimentaire

on:
  push:
    branches:
      - plan-alimentaire-intelligent-chatgpt
  pull_request:
    branches:
      - plan-alimentaire-intelligent-chatgpt

permissions:
  contents: write

jobs:
  jest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Appliquer le micro-raccord 2.3
        if: github.event_name == 'push'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'pages/suivi.js';
          let source = fs.readFileSync(path, 'utf8');

          const importAnchor = "import { supabase } from '../lib/supabaseClient';";
          const importLine = "import { normaliserRepasPourPersistance } from '../lib/repasPersistence';";
          const oldHandler = `  const handleSaveRepas = async (repasData) => {
    try {
      const { data: { user } } = await supabase.auth.getUser();
      const repasPayload = {
        ...repasData,
        user_id: repasData.user_id || user?.id || null,
      };
      // Enregistrement du repas dans Supabase
      const { data, error } = await supabase
        .from("repas_reels")
        .insert([repasPayload]);
      if (error) {
        setSnackbar({ open: true, message: "Erreur Supabase : " + error.message, type: "error" });
        return;
      }
      setSnackbar({ open: true, message: "Repas enregistré !", type: "success" });
    } catch (error) {
      setSnackbar({ open: true, message: "Erreur lors de l'enregistrement du repas.", type: "error" });
    }
  };`;
          const newHandler = `  const handleSaveRepas = async (repasData) => {
    try {
      const { data: { user } } = await supabase.auth.getUser();
      const repasPayloads = normaliserRepasPourPersistance(
        repasData,
        user?.id || null
      );
      // Enregistrement du repas dans Supabase
      const { data, error } = await supabase
        .from("repas_reels")
        .insert(repasPayloads);
      if (error) {
        setSnackbar({ open: true, message: "Erreur Supabase : " + error.message, type: "error" });
        return;
      }
      setSnackbar({ open: true, message: "Repas enregistré !", type: "success" });
    } catch (error) {
      setSnackbar({ open: true, message: "Erreur lors de l'enregistrement du repas.", type: "error" });
    }
  };`;

          const count = (haystack, needle) => haystack.split(needle).length - 1;
          if (source.includes(importLine)) {
            throw new Error('Import déjà présent : arrêt pour éviter un double patch.');
          }
          if (count(source, importAnchor) !== 1) {
            throw new Error(`Ancre Supabase inattendue : ${count(source, importAnchor)} occurrence(s).`);
          }
          if (count(source, oldHandler) !== 1) {
            throw new Error(`Handler historique inattendu : ${count(source, oldHandler)} occurrence(s).`);
          }

          source = source.replace(importAnchor, `${importAnchor}\n${importLine}`);
          source = source.replace(oldHandler, newHandler);
          fs.writeFileSync(path, source);
          NODE
          git diff --check
          git diff -- pages/suivi.js

      - name: Run Jest tests
        run: npm test -- --runInBand

      - name: Commit final du raccord et restauration du workflow
        if: github.event_name == 'push' && success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/tests-plan-alimentaire.yml > .github/workflows/tests-plan-alimentaire.yml
          git add pages/suivi.js .github/workflows/tests-plan-alimentaire.yml
          git diff --cached --check
          git commit -m "Raccorder la persistance repas mono multi"
          git push origin HEAD:plan-alimentaire-intelligent-chatgpt
