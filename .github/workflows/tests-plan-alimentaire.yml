name: Tests plan alimentaire

on:
  push:
    branches:
      - plan-alimentaire-intelligent-chatgpt
  pull_request:
    branches:
      - plan-alimentaire-intelligent-chatgpt

jobs:
  jest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --runInBand
